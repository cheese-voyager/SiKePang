name: CI/CD Backend Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test with Gradle
        run: ./gradlew clean build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest

  deploy-to-ec2:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_BACKEND_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest
            docker stop sikepang-backend || true
            docker rm sikepang-backend || true
            docker run -d -p 8081:8081 --name sikepang-backend \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://10.3.1.56:3307/Sikepang \ # Ganti dengan Private IP EC2 Database
                 SPRING_DATASOURCE_PASSWORD=rootpassword \
                  -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
                    ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest

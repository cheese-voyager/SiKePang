name: CI/CD Backend Pipeline

on:
  push:
    branches: [ "main", "sikepang-chatbot" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test with Gradle
        run: ./gradlew clean build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest

  deploy-to-ec2:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Private EC2 via Bastion Host
        uses: appleboy/ssh-action@v0.1.6
        with:
          proxy_host: ${{ secrets.EC2_FRONTEND_IP }}
          proxy_username: ubuntu
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          host: ${{ secrets.EC2_BACKEND_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest
            sudo docker stop sikepang-backend || true
            sudo docker rm sikepang-backend || true
            sudo docker run -d -p 8081:8081 --name sikepang-backend \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://10.3.1.56:3307/Sikepang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta" \
              -e SPRING_DATASOURCE_PASSWORD="rootpassword" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              ${{ secrets.DOCKER_USERNAME }}/sikepang-backend:latest

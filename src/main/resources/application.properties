server.port=8081
server.address=0.0.0.0

spring.application.name=SiKePang

# Konfigurasi Database MySQL
spring.datasource.url=jdbc:mysql://10.3.1.56:3307/Sikepang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA (Migrasi Database Otomatis)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# API Key Google Gemini
gemini.api.key=${GEMINI_API_KEY}

azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=${AZURE_STORAGE_ACCOUNT};AccountKey=${AZURE_STORAGE_KEY}
azure.storage.container-name=${AZURE_CONTAINER_NAME}

server.port=8081
server.address=127.0.0.1

spring.application.name=SiKePang

# Konfigurasi Database MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sikepang_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Konfigurasi JPA (Migrasi Database Otomatis)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
